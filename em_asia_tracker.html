<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 var(--sans)}button,input,select{font:inherit}button{cursor:pointer}.shell{display:flex;min-height:100vh}.rail{width:218px;flex:0 0 218px;background:var(--surface);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.brand{padding:19px 17px 15px;border-bottom:1px solid var(--border)}.brand strong{font-size:13px;letter-spacing:.06em}.brand strong i{font-style:normal;color:var(--accent)}.brand small{display:block;margin-top:4px;color:var(--faint);font-size:10px;text-transform:uppercase;letter-spacing:.05em}.nav{padding:9px;display:grid;gap:2px;flex:1}.nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:9px 10px;border-radius:6px;font-weight:600}.nav button:hover{background:var(--surface2);color:var(--text)}.nav button.active{background:var(--accent-soft);color:var(--accent)}.nav b{float:right;font:11px var(--mono);color:var(--faint)}.rail-foot{padding:13px;border-top:1px solid var(--border);color:var(--faint);font-size:11px}.rail-foot button{border:0;background:none;color:var(--muted);padding:4px 0}.main{min-width:0;flex:1}.top{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;gap:12px}.title{margin-right:auto;font-size:15px;font-weight:700}.title small{display:block;color:var(--faint);font-size:10px;text-transform:uppercase;letter-spacing:.05em}.search{width:240px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:7px 10px;color:var(--text)}.icon{border:1px solid var(--border);border-radius:6px;background:var(--surface2);color:var(--muted);padding:7px 10px}.content{max-width:1480px;padding:22px 24px 60px;margin:auto}.view{display:none;gap:18px}.view.active{display:grid}.panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}.panel-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:baseline;gap:10px}.panel-head h2{font-size:14px;margin:0}.panel-head small{color:var(--faint)}.panel-body{padding:16px}.eyebrow,.label{font-size:10px;color:var(--faint);font-weight:700;text-transform:uppercase;letter-spacing:.07em}.hero{display:flex;justify-content:space-between;align-items:center;gap:20px}.hero h1{font-size:19px;margin:4px 0}.note{color:var(--muted);font-size:11.5px}.btn{border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:6px;padding:8px 12px;font-weight:600}.btn.primary{background:var(--accent);border-color:var(--accent);color:#062523}.brief{display:grid;grid-template-columns:repeat(2,1fr);gap:0 24px}.brief article{padding:12px 0;border-bottom:1px solid var(--border)}.brief p{margin:3px 0}.table{overflow:auto}.filters{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;background:var(--surface2);border-bottom:1px solid var(--border)}.filters input,.filters select{background:var(--surface);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:6px 8px;font-size:12px}table{border-collapse:collapse;width:100%;min-width:1120px;font-size:12px}th{background:var(--surface2);color:var(--faint);font-size:10px;text-transform:uppercase;letter-spacing:.05em;text-align:left;white-space:nowrap;position:sticky;top:0;padding:9px}td{padding:10px;border-bottom:1px solid var(--border);vertical-align:top}tr:hover{background:var(--surface2)}td.headline{max-width:370px}td.headline strong,td.headline span{display:block}td.headline span{color:var(--muted);font-size:11.5px;margin-top:3px}.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}.badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap}.buy{color:var(--green);background:var(--green-soft)}.hold{color:var(--amber);background:var(--amber-soft)}.sell{color:var(--red);background:var(--red-soft)}.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}.card{border:1px solid var(--border);border-radius:8px;padding:15px;background:var(--surface)}.card-head{display:flex;justify-content:space-between;gap:12px}.card h3{margin:0;font-size:14px}.score{font:700 20px var(--mono);color:var(--accent)}.card p{color:var(--muted);margin:11px 0}.card .meta{font:11px var(--mono);color:var(--faint)}.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.kv div{padding:12px;background:var(--surface2);border-radius:6px}.kv strong{display:block;margin-top:3px;font:700 18px var(--mono)}.list{display:grid;gap:10px}.list-item{padding:13px 15px;border:1px solid var(--border);border-left:5px solid var(--amber);border-radius:7px;background:var(--surface)}.list-item.critical{border-left-color:var(--red)}.list-item h3{margin:0;font-size:13px}.list-item p{margin:5px 0;color:var(--muted)}.calendar{display:grid;gap:0}.event{display:flex;gap:18px;padding:13px 0;border-bottom:1px solid var(--border)}.event time{width:88px;flex:none;color:var(--accent);font:600 12px var(--mono)}.event p{margin:3px 0;color:var(--muted)}@media(max-width:880px){.shell{display:block}.rail{width:100%;height:auto;position:static;border-right:0;border-bottom:1px solid var(--border)}.brand,.rail-foot{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.content{padding:16px}.top{padding:10px 16px}.search{width:min(42vw,240px)}.brief,.kv{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}}

<body>
<div class="shell"><aside class="rail"><div class="brand"><strong>EM<i>·</i>ASIA <i>TERMINAL</i></strong><small>Industrials &amp; Materials Desk</small></div><nav class="nav" id="nav"></nav><div class="rail-foot"><button id="theme">◐ Toggle theme</button><div>Analyst: Esha Bhatia<br>NMG Consulting</div></div></aside><main class="main"><header class="top"><div class="title">EM &amp; Asia Equity News &amp; Stock Opportunity Tracker<small id="subtitle">Live Investment Dashboard</small></div><input class="search" id="search" placeholder="Search company, ticker, theme"><button class="icon" id="themeTop" aria-label="Toggle theme">◐</button></header><div class="content" id="content"></div></main></div>
<script>
const DATA={
news:[
{id:'n01',date:'2026-08-25',country:'Taiwan',company:'TSMC',ticker:'2330.TW / TSM',sector:'Semiconductors',event:'Capex',headline:'TSMC chemical-tubing suppliers plan new Hsinchu-area plant',summary:'Upstream PFA tubing production is being localised around the expanding Taiwan fab cluster.',signal:'MONITOR',materiality:5},
{id:'n02',date:'2026-08-25',country:'South Korea',company:'Samsung Electronics',ticker:'005930.KS',sector:'Semiconductors',event:'Capex',headline:'Samsung reportedly begins groundwork for a second Taylor, Texas foundry fab',summary:'Supplier groundwork adds another data point to the foundry-capacity-tightness thesis.',signal:'BUY',materiality:6},
{id:'n03',date:'2026-08-25',country:'Brazil',company:'Braskem',ticker:'BRKM5.SA / BAK',sector:'Petrochemicals',event:'Balance sheet',headline:'Braskem restructuring secures preliminary creditor backing',summary:'The balance-sheet repair remains unresolved and Petrobras funding is still being negotiated.',signal:'SELL WATCH',materiality:8},
{id:'n04',date:'2026-08-25',country:'India',company:'Larsen & Toubro',ticker:'LT.NS',sector:'Industrials',event:'Contract',headline:'L&T renewables arm wins multi-GWh Middle East battery-storage order',summary:'A concrete BESS order supports diversification, though value and client remain undisclosed.',signal:'MONITOR',materiality:5},
{id:'n05',date:'2026-08-24',country:'Peru/Brazil',company:'Nexa Resources',ticker:'NEXA',sector:'Mining',event:'Commodity',headline:'Zinc hits a four-year LME high on inventory drawdown',summary:'The overlooked base-metal move creates operating leverage for zinc-focused miners.',signal:'BUY WATCH',materiality:7},
{id:'n06',date:'2026-08-23',country:'China',company:'CATL',ticker:'300750.SZ / 3750.HK',sector:'EV batteries',event:'Customer development',headline:'CATL Mall passes 1,800 signed energy-storage integrators',summary:'Direct distribution expands reach but introduces a channel-margin question.',signal:'HOLD',materiality:6}
],
opportunities:[
{company:'Samsung Electronics',ticker:'005930.KS',country:'South Korea',sector:'Memory / Foundry',score:82,rec:'BUY',thesis:'Foundry pricing power is inflecting while DRAM and NAND pricing create a second earnings leg.',catalyst:'Reported 4nm/5nm price hikes plus record memory pricing.'},
{company:'ST Engineering',ticker:'S63.SI',country:'Singapore',sector:'Aerospace & Defence',score:78,rec:'BUY',thesis:'A diversified record backlog provides structural visibility across aerospace, defence and infrastructure.',catalyst:'S$2.9bn 2Q26 orders and S$35.7bn order book.'},
{company:'Sembcorp Industries',ticker:'U96.SI',country:'Singapore',sector:'Utilities / Renewables',score:76,rec:'BUY',thesis:'The Alinta acquisition expands the earnings base into Australian renewables and firming capacity.',catalyst:'Completed $4.32bn acquisition with a 10.4GW development pipeline.'},
{company:'Zijin Mining',ticker:'601899.SS / 2899.HK',country:'China',sector:'Gold / Copper / Lithium',score:75,rec:'BUY WATCH',thesis:'Lithium is scaling as a third pillar alongside a strong gold and copper backdrop.',catalyst:'H1 profit guidance up 68%; Manono lithium plant started production.'},
{company:'Samsung SDI',ticker:'006400.KS',country:'South Korea',sector:'Batteries / Materials',score:73,rec:'BUY WATCH',thesis:'A contrarian turnaround is being driven by UPS and AI-datacentre backup demand, not only EVs.',catalyst:'First profitable quarter after seven consecutive losses.'},
{company:'Nexa Resources',ticker:'NEXA',country:'Peru/Brazil',sector:'Zinc Mining',score:68,rec:'BUY WATCH',thesis:'A fixed-cost mine base offers torque to the fresh zinc inventory squeeze.',catalyst:'Zinc near $3,980/t with LME stocks down 12% in 30 days.'}
],
sell:[
{company:'Braskem S.A.',ticker:'BRKM5.SA / BAK',country:'Brazil',severity:'Critical',reason:'Restructuring covers roughly $10.9bn of debt and still depends on full creditor approval plus Petrobras support.'},
{company:'PT Vale Indonesia',ticker:'INCO.JK',country:'Indonesia',severity:'High',reason:'2026 mining quotas are materially below target, threatening feedstock for the Pomalaa smelter ramp-up.'},
{company:'CSN',ticker:'CSNA3.SA / SID',country:'Brazil',severity:'High',reason:'Elevated leverage and continuing FX losses make the deleveraging case dependent on asset sales that are not yet closed.'},
{company:'SATS Ltd',ticker:'S58.SI',country:'Singapore',severity:'Medium',reason:'Management warned that oil and Middle East routing costs could pressure earnings after an 11% sell-off.'}
],
calendar:[['2026-08-27','Bank of Korea rate decision','A policy surprise would affect KRW and Korean semiconductor funding costs.'],['2026-09-22','Bank Indonesia governors meeting','Relevant to IDR and the cost of capital for Indonesian materials names.'],['2026-10-16','TSMC Q3 2026 earnings call','The key read-through for semicap, packaging and AI infrastructure demand.'],['2026-10-29','Samsung Electronics Q3 results','Watch memory pricing, HBM4 progress and foundry price follow-through.']]
};
const NAV=[['dashboard','Dashboard'],['opportunities','Opportunities',DATA.opportunities.length],['sell','Sell Watch',DATA.sell.length],['calendar','Catalyst Calendar',DATA.calendar.length],['news','Live News',DATA.news.length]];let state={tab:'dashboard',query:''};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function badge(v){let c=/SELL/.test(v)?'sell':/BUY/.test(v)?'buy':'hold';return `<span class="badge ${c}">${esc(v)}</span>`}
function renderNav(){nav.innerHTML=NAV.map(([id,label,count])=>`<button class="${state.tab===id?'active':''}" data-tab="${id}">${label}${count!==undefined?`<b>${count}</b>`:''}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()})}
function dashboard(){return `<section class="view active"><div class="panel"><div class="panel-body hero"><div><div class="eyebrow">Live investment dashboard</div><h1>EM &amp; Asia Industrials/Materials</h1><div class="note">Research snapshot compiled 26 Aug 2026 · primary and local sources prioritised</div></div><button class="btn primary" onclick="refresh()">↻ Refresh intelligence</button></div></div><div class="panel"><div class="panel-head"><h2>Executive Brief</h2><small>Current desk view</small></div><div class="panel-body brief"><article><div class="label">Most important development</div><p>TSMC's capex raise and Korea's chip-cluster power buildout confirm the AI infrastructure cycle is spreading beyond chip designers.</p></article><article><div class="label">Best new candidate</div><p>Samsung Electronics: foundry pricing power plus a record memory cycle offers a clear expectations gap.</p></article><article><div class="label">Biggest downside risk</div><p>Chile's copper supply setbacks collide with a historically tight market, increasing both upside and correction risk.</p></article><article><div class="label">Thesis deterioration</div><p>PT Vale Indonesia's quota shortfall threatens the Pomalaa downstreaming ramp-up.</p></article></div></div>${newsPanel()}</section>`}
function newsPanel(){let rows=DATA.news.filter(n=>!state.query||Object.values(n).join(' ').toLowerCase().includes(state.query));return `<div class="panel"><div class="panel-head"><h2>Live News / Catalyst Table</h2><small>${rows.length} of ${DATA.news.length} developments</small></div><div class="filters"><input id="tableSearch" value="${esc(state.query)}" placeholder="Filter news"><select id="signal"><option value="">All signals</option><option>BUY</option><option>HOLD</option><option>SELL WATCH</option></select></div><div class="table"><table><thead><tr><th>Date</th><th>Country</th><th>Company</th><th>Ticker</th><th>Sector</th><th>Headline / summary</th><th>Signal</th><th>Materiality</th></tr></thead><tbody>${rows.map(n=>`<tr><td class="mono">${n.date}</td><td>${esc(n.country)}</td><td><strong>${esc(n.company)}</strong></td><td class="mono">${esc(n.ticker)}</td><td>${esc(n.sector)}</td><td class="headline"><strong>${esc(n.headline)}</strong><span>${esc(n.summary)}</span></td><td>${badge(n.signal)}</td><td>${badge(`${n.materiality}/10`)}</td></tr>`).join('')}</tbody></table></div></div>`}
function opportunities(){return `<section class="view active"><div class="panel"><div class="panel-head"><h2>Top Stock Opportunities</h2><small>Transparent analyst scoring, 100-point scale</small></div><div class="panel-body"><div class="cards">${DATA.opportunities.map((o,i)=>`<article class="card"><div class="card-head"><div><div class="label">${String(i+1).padStart(2,'0')} · ${esc(o.country)}</div><h3>${esc(o.company)}</h3><div class="meta">${esc(o.ticker)} · ${esc(o.sector)}</div></div><div class="score">${o.score}</div></div><p>${esc(o.thesis)}</p><div class="label">Catalyst</div><div class="note">${esc(o.catalyst)}</div><br>${badge(o.rec)}</article>`).join('')}</div></div></div></section>`}
function sell(){return `<section class="view active"><div class="panel"><div class="panel-head"><h2>Deteriorating Positions / Sell Watch</h2><small>Reason, severity and evidence-led change trigger</small></div><div class="panel-body list">${DATA.sell.map(s=>`<article class="list-item ${s.severity==='Critical'?'critical':''}"><h3>${esc(s.company)} <span class="mono muted">${esc(s.ticker)}</span> ${badge(s.severity)}</h3><p>${esc(s.reason)}</p><div class="label">What would change the view</div><div class="note">Confirmed operational improvement, closed asset sales or a durable reduction in the cited risk.</div></article>`).join('')}</div></div></section>`}
function calendar(){return `<section class="view active"><div class="panel"><div class="panel-head"><h2>Catalyst Calendar</h2><small>Upcoming events with portfolio relevance</small></div><div class="panel-body calendar">${DATA.calendar.map(e=>`<article class="event"><time>${e[0]}</time><div><strong>${esc(e[1])}</strong><p>${esc(e[2])}</p></div></article>`).join('')}</div></div></section>`}
function render(){renderNav();let html=state.tab==='dashboard'?dashboard():state.tab==='opportunities'?opportunities():state.tab==='sell'?sell():calendar();content.innerHTML=html;subtitle.textContent=state.tab==='dashboard'?'Live Investment Dashboard':NAV.find(n=>n[0]===state.tab)[1];let input=document.getElementById('tableSearch');if(input)input.oninput=e=>{state.query=e.target.value.toLowerCase();render()}}
function refresh(){const b=document.querySelector('.primary');b.textContent='Reprocessing...';setTimeout(()=>{b.textContent='✓ Intelligence refreshed';setTimeout(()=>b.textContent='↻ Refresh intelligence',900)},500)}
function toggleTheme(){let dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'light':'dark';localStorage.setItem('emt_theme',dark?'light':'dark')}
function init(){if(localStorage.getItem('emt_theme'))document.documentElement.dataset.theme=localStorage.getItem('emt_theme');theme.onclick=toggleTheme;themeTop.onclick=toggleTheme;search.oninput=e=>{state.query=e.target.value.toLowerCase();state.tab='dashboard';render()};render();fetch('data-refresh.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{subtitle.textContent=`${subtitle.textContent} · Refreshed ${new Date(d.refreshedAt).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}`}).catch(()=>{});}init();
</script>
